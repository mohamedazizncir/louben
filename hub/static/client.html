<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%232563eb%22/%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TheBridgeFlow · Voice advisor</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body { display: flex; flex-direction: column; }
    .wrap { flex: 1; display: flex; justify-content: center; padding: 28px 16px; min-height: 0; height: calc(100vh - 68px); }
    .wrap .panel { width: min(680px, 100%); box-shadow: 0 20px 50px -24px rgba(15,23,42,.25); }
    body.embed .topbar { display: none; }
    body.embed .wrap { padding: 0; height: 100vh; }
    body.embed .wrap .panel { width: 100%; border-radius: 0; border: none; }
  </style>
</head>
<body>
  <div class="topbar"><div class="brand"><span class="mark"><span id="brand-ico"></span></span><span>TheBridge<span class="flow">Flow</span></span></div>
    <span class="chip">Voice advisor</span><span class="spacer"></span><span class="live"><i></i>Online</span></div>
  <div class="wrap"><section class="panel"><div id="chat" style="flex:1;min-height:0"></div></section></div>
  <script src="/static/bus.js"></script>
  <script src="/static/voice.js"></script>
  <script src="/static/chat.js"></script>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get("embed")) document.body.classList.add("embed");
    document.getElementById("brand-ico").innerHTML = UI.icon("spark", "");
    document.querySelectorAll(".live").forEach(e => e.classList.add("on"));
    ChatWidget.mount(document.getElementById("chat"), { lang: q.get("lang") || "fr" });
  </script>
</body>
</html>
