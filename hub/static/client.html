<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%2322d3ee%22/%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talk to our advisor</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body { display: flex; flex-direction: column; }
    .wrap { flex: 1; display: flex; justify-content: center; padding: 14px; min-height: 0; }
    .wrap .panel { width: min(640px, 100%); }
    body.embed .topbar { display: none; }
    body.embed .wrap { padding: 0; }
    body.embed .wrap .panel { width: 100%; border-radius: 0; border: none; }
  </style>
</head>
<body>
  <div class="topbar"><div class="brand">Advisor<span>.</span></div><span class="tag">voice or text · secured by Louben</span>
    <span class="spacer"></span><span class="live"><i></i>online</span></div>
  <div class="wrap"><section class="panel"><div id="chat" style="flex:1;min-height:0"></div></section></div>
  <script src="/static/bus.js"></script>
  <script src="/static/voice.js"></script>
  <script src="/static/chat.js"></script>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get("embed")) document.body.classList.add("embed");
    document.querySelectorAll(".live").forEach(e => e.classList.add("on"));
    ChatWidget.mount(document.getElementById("chat"), { lang: q.get("lang") || "fr" });
  </script>
</body>
</html>
